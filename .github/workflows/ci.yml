name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

env:
  NODE_LTS: "22"
  HUSKY: "0"

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: biomejs/setup-biome@v2
        with:
          version: latest
      - run: biome check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        backend: [sqlite, postgres]
    services:
      # Postgres is only consumed when backend == postgres, but defining it
      # unconditionally is cheaper than templating jobs.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Run tests (${{ matrix.backend }})
        run: |
          if [ "${{ matrix.backend }}" = "postgres" ]; then
            POSTGRES_TEST_URL=postgres://test:test@localhost:5433/test \
              npm run db:postgres:push
            TEST_DB=postgres \
              DATABASE_URL=postgres://test:test@localhost:5433/test \
              npx vitest run --coverage
          else
            npm run db:sqlite:push
            TEST_DB=sqlite DATABASE_URL=file:./dev.db \
              npx vitest run --coverage
          fi
      - name: Upload coverage to Codecov
        if: matrix.node-version == fromJSON(env.NODE_LTS) && matrix.backend == 'sqlite'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        example: [basic, camel-case, esm, logging, read-replica]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: "npm"
      - run: npm ci
      - name: Run example
        working-directory: examples/${{ matrix.example }}
        run: |
          npm install
          npm start
